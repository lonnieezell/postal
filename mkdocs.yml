site_name: Postal
site_description: A modern, driver-based email library for CodeIgniter 4.

exclude_docs: |
  adr/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: codeigniter
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - content.action.edit
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - navigation.path
    - navigation.indexes
    - toc.follow

extra:
  homepage: https://codeigniter.com
  generator: false

  social:
    - icon: material/github
      link: https://github.com/lonnieezell/postal
      name: GitHub
    - icon: material/forum
      link: https://github.com/lonnieezell/postal/discussions
      name: Discussions

repo_url: https://github.com/lonnieezell/postal
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Lonnie Ezell.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path: ["docs"]
      check_paths: false
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      # Snippets rarely open with <?php, which Pygments needs to highlight PHP.
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - toc:
      toc_depth: 3
  - tables

extra_css:
  - assets/css/codeigniter.css
  - assets/css/codeigniter_dark_mode.css

nav:
  - Getting Started:
    - Home: index.md
    - Installation: installation.md
    - Quick Start: quick-start.md
    - Migrating from CI4's Email: migrating-from-ci4.md
  - Guides:
    - Mailables: mailables.md
    - Markdown Mailables: markdown-mailables.md
    - Previewing Mailables: previewing.md
    - Events: events.md
    - Suppression & Unsubscribe: suppression-unsubscribe.md
    - Testing: testing.md
    - DKIM Signing: dkim-signing.md
    - Failover: failover-mailer.md
    - Writing a Custom Transport: custom-transports.md
  - Transports:
    - SMTP: smtp-mailer.md
    - Sendmail & Mail: sendmail-mail-mailers.md
    - Amazon SES: ses-mailer.md
    - Resend: resend-mailer.md
    - Log: log-mailer.md
  - Reference:
    - Email: reference/email.md
    - SendResult: reference/send-result.md
    - Config\Mailer: reference/config-mailer.md
    - Config\Postal: reference/config-postal.md
    - Legacy Compatibility: legacy-compatibility.md
    - CLI Commands: cli-commands.md
    - Changelog: changelog.md
  - Explanation:
    - How Postal Works: how-postal-works.md
    - MIME Rendering: mime-rendering.md
