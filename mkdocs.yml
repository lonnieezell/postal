site_name: Postal
site_description: A modern, driver-based email library for CodeIgniter 4.

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - content.code.copy
    - navigation.footer
    - content.action.edit
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share

repo_url: https://github.com/lonnieezell/postal
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Lonnie Ezell.

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables

plugins:
  - search

nav:
  - Getting Started:
    - Home: index.md
    - Quick Start: quick-start.md
  - Sending Mail:
    - Mailables: mailables.md
    - Markdown Mailables: markdown-mailables.md
    - Testing: testing.md
  - Transports:
    - SMTP: smtp-mailer.md
    - Amazon SES: ses-mailer.md
    - Log: log-mailer.md
    - Sendmail & Mail: sendmail-mail-mailers.md
    - Failover: failover-mailer.md
  - Advanced:
    - DKIM Signing: dkim-signing.md
    - Suppression & Unsubscribe: suppression-unsubscribe.md
    - Events: events.md
    - MIME Rendering: mime-rendering.md
  - Reference:
    - Legacy Compatibility: legacy-compatibility.md
    - CLI Commands: cli-commands.md
    - Installation: installation.md
    - Changelog: changelog.md
